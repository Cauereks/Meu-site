<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#187bff">
  <title>Página não encontrada | Zuboozin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, sans-serif;
      color: #f4f9ff;
      background:
        linear-gradient(rgba(5, 18, 34, .78), rgba(5, 18, 34, .88)),
        url("images/hero-poster.jpg") center / cover;
    }
    main {
      width: min(560px, 100%);
      padding: clamp(28px, 6vw, 54px);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 24px;
      background: rgba(7, 30, 56, .72);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .3);
      text-align: center;
      backdrop-filter: blur(14px);
    }
    .code {
      margin: 0;
      color: #8fc2ff;
      font-size: clamp(64px, 18vw, 112px);
      font-weight: 800;
      line-height: .9;
    }
    h1 { margin: 22px 0 10px; font-size: clamp(26px, 6vw, 38px); }
    p { margin: 0 auto 28px; color: #dcecff; line-height: 1.65; }
    a {
      min-height: 48px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #0f62d6;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
    a:hover { background: #0b4fae; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço pode ter mudado ou não existir. Volte ao início para continuar explorando o setup.</p>
    <a href="./">Voltar ao início</a>
  </main>
</body>
</html>
